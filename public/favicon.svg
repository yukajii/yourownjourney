<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Leagues">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a24" />
      <stop offset="1" stop-color="#0b0b0f" />
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7ee3ff" />
      <stop offset="1" stop-color="#2aa8e0" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)" />

  <g fill="url(#foot)" transform="translate(50 51) rotate(-6) translate(-50 -51)">
    <!-- toes -->
    <circle cx="31.5" cy="24.5" r="6.6" />
    <circle cx="44.5" cy="18.5" r="5.3" />
    <circle cx="56.0" cy="19.0" r="4.8" />
    <circle cx="66.0" cy="22.5" r="4.2" />
    <circle cx="74.5" cy="28.0" r="3.6" />
    <!-- arch, drawn first so the sole and heel sit on top of it -->
    <path d="M43 50 Q45 66 56 75" fill="none" stroke="url(#foot)"
          stroke-width="14" stroke-linecap="round" />
    <!-- ball of the foot / sole -->
    <ellipse cx="50" cy="47" rx="22" ry="15.5" />
    <!-- heel -->
    <ellipse cx="57" cy="76" rx="13.5" ry="13" />
  </g>
</svg>
